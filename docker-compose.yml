services:
  postgres:
    image: postgres:16
    container_name: viettien_postgres
    restart: always
    environment:
      POSTGRES_DB: viettien_db
      POSTGRES_USER: viettien_user
      POSTGRES_PASSWORD: viettien_password
    ports:
      - "5432:5432"
    volumes:
      - viettien_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: viettien_redis
    restart: always
    ports:
      - "6379:6379"

volumes:
  viettien_postgres_data: